version: 2
updates:
  # Dependabot here means advisories only. open-pull-requests-limit: 0 turns version updates
  # off; security updates are exempt from the limit and still open a pull request when an
  # advisory affects a package. Every other upgrade is a deliberate change by a human.
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
