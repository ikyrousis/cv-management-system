name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build backend/CVManagement.sln -c Release
      - name: Advisory check on NuGet packages
        # `dotnet list package --vulnerable` has no machine-readable failure exit code, so the
        # clean-answer sentence is required for every project or the step fails.
        run: |
          set -euo pipefail
          for project in backend/CVManagement/CVManagement.csproj backend/CVManagement.Tests/CVManagement.Tests.csproj; do
            output=$(dotnet list "$project" package --vulnerable --include-transitive)
            echo "$output"
            if ! grep -qi "has no vulnerable packages" <<< "$output"; then
              echo "::error::Vulnerable NuGet packages found in $project"
              exit 1
            fi
          done
      - name: Test (unit + integration via Testcontainers)
        run: dotnet test backend/CVManagement.Tests/CVManagement.Tests.csproj -c Release --no-build --logger "trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: TestResults

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Advisory check on runtime dependencies
        # Only the shipped graph is a hard gate. react-scripts drags in a large build-time
        # dependency tree that is reported below without blocking.
        run: npm audit --omit=dev --audit-level=low
      - name: Build-time dependency advisories (report only)
        run: npm audit --audit-level=low
        continue-on-error: true
      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # gitleaks-action posts its own check run, which needs the checks permission.
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # CodeQL analysis requires Code Security to be enabled for the repository.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp, javascript
      - name: Build for analysis
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build backend/CVManagement.sln -c Release
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
