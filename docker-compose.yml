services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in a .env file next to docker-compose.yml}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/CVManagement/Dockerfile
    environment:
      ConnectionStrings__CVManagement: "Server=sql;Database=CVManagementDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      CvEncryption__Key: ${CV_ENCRYPTION_KEY:?Set CV_ENCRYPTION_KEY in a .env file next to docker-compose.yml}
    ports:
      - "5293:8080"
    depends_on:
      sql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  sqldata:
